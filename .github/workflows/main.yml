name: Part 2 - Build and Test API

# Runs on every push and pull request: builds the solution, then runs all unit tests.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build and run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore RaceDay-Repo/RaceDay.sln

      - name: Build
        run: dotnet build Part2-API/RaceDay.sln --configuration Release --no-restore 

      - name: Run unit tests
        run: dotnet test Part2-API/RaceDay.sln --configuration Release --no-build --verbosity normal 
